[package]
name = "diff-parsing-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Unified diff parser with typed and contract-layer APIs"

[dependencies]
regex = { workspace = true }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
