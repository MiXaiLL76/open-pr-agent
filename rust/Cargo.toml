[workspace]
resolver = "2"
members = [
    "agent-rs",
    "app",
    "diff-parsing-rs",
]

[workspace.dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
sha2 = "0.10"
toml = "0.9"
serde_yaml_ng = "0.10"
clap = "4"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
hmac = "0.12"

[profile.release]
lto = true
