name: open-pr-agent

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repository PRs only; forks get no write token path.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      PR_AGENT_IMAGE: ghcr.io/mixaill76/open-pr-agent:latest
      PR_AGENT_LLM_BASE_URL: ${{ secrets.PR_AGENT_LLM_BASE_URL }}
      PR_AGENT_LLM_API_KEY: ${{ secrets.PR_AGENT_LLM_API_KEY }}
      PR_AGENT_MODEL: ${{ secrets.PR_AGENT_MODEL }}
    steps:
      - name: Check configuration
        run: |
          if [ -n "$PR_AGENT_LLM_BASE_URL" ] || [ -n "$PR_AGENT_LLM_API_KEY" ] || [ -n "$PR_AGENT_MODEL" ]; then
            test -n "$PR_AGENT_LLM_BASE_URL" && test -n "$PR_AGENT_LLM_API_KEY" && test -n "$PR_AGENT_MODEL" || {
              echo '::error::Set all three: PR_AGENT_LLM_BASE_URL, PR_AGENT_LLM_API_KEY, PR_AGENT_MODEL (provider/model).'
              exit 1
            }
          fi

      # The engine preflight: binary + model + one-shot completion ping.
      # Replaces the old inline Python /models probe.
      - name: Check engine
        run: |
          docker run --rm --network host \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -e PR_AGENT_LLM_BASE_URL -e PR_AGENT_LLM_API_KEY -e PR_AGENT_MODEL \
            --entrypoint pr_agent "$PR_AGENT_IMAGE" doctor

      - name: Review pull request
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB__USER_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --network host \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            -e PR_URL -e GITHUB_ACTIONS -e GITHUB__USER_TOKEN \
            -e PR_AGENT_LLM_BASE_URL -e PR_AGENT_LLM_API_KEY -e PR_AGENT_MODEL \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY -e ALL_PROXY \
            -e http_proxy -e https_proxy -e no_proxy -e all_proxy \
            "$PR_AGENT_IMAGE" 2>&1 | tee "$RUNNER_TEMP/pr-agent.log"
          if grep -Eq 'Failed to (review|process)' "$RUNNER_TEMP/pr-agent.log"; then
            echo '::error::open-pr-agent could not complete the review; see the log above.'
            exit 1
          fi
