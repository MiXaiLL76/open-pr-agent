[project]
site_name = "open-pr-agent"
site_description = "AI reviewer for pull requests, powered by the opencode engine"
site_url = "https://mixaill76.github.io/open-pr-agent/"
repo_url = "https://github.com/MiXaiLL76/open-pr-agent"
repo_name = "MiXaiLL76/open-pr-agent"

nav = [
  { "Home" = "index.md" },
  { "Configuration" = "configuration.md" },
  { "Engine" = "engine.md" },
  { "Examples" = "examples.md" },
]

[project.theme]
palette = [
  { scheme = "default", primary = "indigo", accent = "indigo", toggle = { icon = "material/brightness-7", name = "Switch to dark mode" } },
  { scheme = "slate", primary = "indigo", accent = "indigo", toggle = { icon = "material/brightness-4", name = "Switch to light mode" } },
]
features = [
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "content.action.edit",
  "search.highlight",
]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]
